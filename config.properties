# =============================================================================
# PermiCarga Marietha - Parametros de conexion
# =============================================================================
#
# Este archivo se edita con cualquier editor de texto (Bloc de notas sirve).
# No hace falta recompilar el programa para cambiar la conexion: basta con
# guardar este archivo y volver a abrir el aplicativo.
#
# -----------------------------------------------------------------------------
# DIRECCION DE LA BASE DE DATOS
# -----------------------------------------------------------------------------
# Formato:  jdbc:<gestor>://<servidor>:<puerto>/<base>?<opciones>
#
# Si la base de datos esta en la misma computadora, deje localhost. Si esta en
# otra maquina de la red, reemplace localhost por su direccion IP.
#
bd.url=jdbc:mariadb://localhost:3306/marietha?useUnicode=true&characterEncoding=UTF-8

# -----------------------------------------------------------------------------
# CREDENCIALES DE LA CUENTA DE BASE DE DATOS
# -----------------------------------------------------------------------------
# Son las credenciales con las que usted entra a MySQL Workbench, no las del
# aplicativo. Las cuentas del aplicativo (admin, operador, consulta) viven
# dentro de la tabla USUARIO y se piden en la pantalla de acceso.
#
bd.usuario=marietha_app
bd.clave=Marietha2026

# -----------------------------------------------------------------------------
# CONTROLADOR JDBC
# -----------------------------------------------------------------------------
# El aplicativo incluye el controlador de MariaDB, que se comunica tanto con
# MariaDB como con MySQL, incluida la autenticacion caching_sha2_password que
# MySQL 8 y posteriores usan de forma predeterminada.
#
bd.controlador=org.mariadb.jdbc.Driver

# Si en alguna maquina este controlador diera problemas, descargue el
# controlador oficial de MySQL (mysql-connector-j.jar), colóquelo en la carpeta
# lib junto al aplicativo y reemplace las dos lineas anteriores por estas,
# quitandoles el signo de numero del comienzo:
#
#bd.url=jdbc:mysql://localhost:3306/marietha?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
#bd.controlador=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------------
# TIEMPO DE ESPERA
# -----------------------------------------------------------------------------
# Segundos que el aplicativo espera una respuesta del servidor antes de avisar
# que no hay conexion.
#
bd.espera.segundos=10
